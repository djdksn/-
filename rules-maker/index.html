<style>
/* ===== tokens ===== */
:root {
  --ink-1000: #0c0e16; --ink-950: #11131c; --ink-900: #161927; --ink-850: #1a1d29;
  --ink-800: #1e2230; --ink-700: #262b3b; --ink-600: #313749; --ink-500: #3e4459;
  --ink-400: #525a73; --ink-300: #6d758f; --ink-200: #8a92ab; --ink-100: #adb4cb;
  --ink-25: #e6e9f4; --ink-50: #cdd2e3;
  --sakura-400: #ff6b9a; --sakura-500: #f04e84; --sakura-300: #ff8caf; --sakura-200: #ffb3c8;
  --wisteria-300: #a691ff; --wisteria-400: #8a72f0; --wisteria-500: #6a55d6; --wisteria-200: #c8b8ff;
  --moss-200: #91e0b5; --moss-300: #5fc99a;
  --amber-200: #ffcf7a; --amber-300: #ffae42;
  --vermil-200: #ffb5b5; --vermil-300: #ff8888;
  --bg-base: var(--ink-950); --bg-canvas: var(--ink-900); --bg-surface: var(--ink-850);
  --bg-elevated: var(--ink-800); --bg-floating: var(--ink-700);
  --bg-hover: rgba(255,255,255,0.04); --bg-active: rgba(255,255,255,0.08);
  --fg-primary: var(--ink-25); --fg-secondary: var(--ink-100);
  --fg-tertiary: var(--ink-300); --fg-quaternary: var(--ink-400);
  --border-faint: rgba(255,255,255,0.04); --border-soft: rgba(255,255,255,0.08);
  --border-base: rgba(255,255,255,0.12);
  --accent: var(--sakura-400); --accent-glow: rgba(255,107,154,0.32);
  --font-sans: "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-serif: "Noto Serif SC","Source Han Serif SC","Songti SC",serif;
  --font-display: "Cormorant Garamond","Noto Serif SC",serif;
  --font-mono: "JetBrains Mono","SF Mono","Consolas",monospace;
  --fs-2xs:10px;--fs-xs:11px;--fs-sm:12px;--fs-md:13px;--fs-base:14px;--fs-lg:15px;--fs-xl:17px;
  --sp-1:2px;--sp-2:4px;--sp-3:6px;--sp-4:8px;--sp-5:10px;--sp-6:12px;--sp-7:14px;--sp-8:16px;
  --sp-10:20px;--sp-12:24px;--sp-14:28px;--sp-16:32px;
  --r-xs:4px;--r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:18px;--r-2xl:24px;--r-full:999px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.22),0 1px 2px rgba(0,0,0,0.14);
  --shadow-md:0 4px 8px -2px rgba(0,0,0,0.32),0 2px 4px -2px rgba(0,0,0,0.22);
  --shadow-xl:0 24px 50px -12px rgba(0,0,0,0.55),0 8px 16px -8px rgba(0,0,0,0.35);
  --shadow-2xl:0 36px 80px -20px rgba(0,0,0,0.7),0 12px 24px -12px rgba(0,0,0,0.45);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,0.04);
  --lh-relaxed:1.7; --lh-loose:1.9;
  --ease-out:cubic-bezier(0.22,1,0.36,1); --ease-in:cubic-bezier(0.55,0,0.7,0.2);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1); --ease-soft:cubic-bezier(0.4,0,0.2,1);
  --t-fast:140ms; --t-base:220ms; --t-slow:380ms;
  --z-modal:200; --z-toast:500;
  --glass-bg-strong:rgba(22,25,39,0.88);
  --glass-blur:saturate(180%) blur(16px);
}

/* ===== base ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg-base);color:var(--fg-primary);font-family:var(--font-sans);font-size:var(--fs-base);line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{width:1em;height:1em;flex-shrink:0}
::selection{background:var(--sakura-500);color:#fff}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink-600);border-radius:var(--r-full)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-500)}
*{scrollbar-color:var(--ink-600) transparent;scrollbar-width:thin}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
button:focus{outline:none}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== components (subset) ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-4);height:34px;padding:0 var(--sp-8);border-radius:var(--r-md);font-size:var(--fs-sm);font-weight:500;letter-spacing:0.04em;cursor:pointer;transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast),transform var(--t-fast),box-shadow var(--t-fast);white-space:nowrap;user-select:none;position:relative;overflow:hidden}
.btn:active{transform:scale(0.97)}
.btn svg{width:14px;height:14px}
.btn-primary{background:linear-gradient(135deg,var(--sakura-500),var(--wisteria-500));color:#fff;box-shadow:0 4px 12px -2px var(--accent-glow),var(--shadow-inset)}
.btn-primary:hover{background:linear-gradient(135deg,var(--sakura-400),var(--wisteria-400));box-shadow:0 6px 18px -2px var(--accent-glow),var(--shadow-inset);transform:translateY(-1px)}
.btn-ghost{background:var(--bg-elevated);color:var(--fg-secondary);border:1px solid var(--border-soft)}
.btn-ghost:hover{background:var(--bg-floating);border-color:var(--border-base);color:var(--fg-primary)}
.btn-soft{background:rgba(255,107,154,0.10);color:var(--sakura-300);border:1px solid rgba(255,107,154,0.18)}
.btn-soft:hover{background:rgba(255,107,154,0.16);color:var(--sakura-200)}
.btn-sm{height:28px;padding:0 var(--sp-6);font-size:var(--fs-xs)}
.btn-block{width:100%}
.input,.textarea,.select{width:100%;height:34px;padding:0 var(--sp-7);background:var(--ink-900);border:1px solid var(--border-base);border-radius:var(--r-md);color:var(--fg-primary);font-size:var(--fs-sm);font-family:var(--font-sans);outline:0;transition:border-color var(--t-fast),box-shadow var(--t-fast),background var(--t-fast)}
.textarea{height:auto;min-height:80px;padding:var(--sp-5) var(--sp-7);resize:vertical;line-height:var(--lh-relaxed)}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);background:var(--ink-850)}
.input::placeholder,.textarea::placeholder{color:var(--fg-quaternary);font-style:italic}
.switch{display:inline-flex;align-items:center;gap:var(--sp-5);cursor:pointer;user-select:none}
.switch-track{position:relative;width:36px;height:20px;border-radius:var(--r-full);background:var(--ink-700);border:1px solid var(--border-soft);transition:background var(--t-base) var(--ease-soft);flex-shrink:0}
.switch-track::after{content:"";position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:linear-gradient(180deg,var(--ink-200),var(--ink-300));box-shadow:var(--shadow-sm);transition:left var(--t-base) var(--ease-spring),background var(--t-base)}
.switch input{display:none}
.switch input:checked+.switch-track{background:linear-gradient(135deg,var(--sakura-500),var(--wisteria-500))}
.switch input:checked+.switch-track::after{left:17px;background:linear-gradient(180deg,#fff,var(--sakura-100))}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px var(--sp-4);border-radius:var(--r-xs);font-size:var(--fs-2xs);letter-spacing:0.06em;font-weight:500;background:var(--bg-elevated);color:var(--fg-secondary);border:1px solid var(--border-soft)}
.badge-amber{background:rgba(255,174,66,0.10);color:var(--amber-200);border-color:rgba(255,174,66,0.20)}
.chip-btn{display:inline-flex;align-items:center;gap:var(--sp-3);padding:5px var(--sp-6);border-radius:var(--r-sm);color:var(--fg-secondary);font-size:var(--fs-xs);letter-spacing:0.04em;transition:all var(--t-fast)}
.chip-btn:hover{background:var(--bg-hover);color:var(--accent)}
.chip-btn svg{width:13px;height:13px}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-md);color:var(--fg-tertiary);transition:all var(--t-fast)}
.iconbtn:hover{background:var(--bg-hover);color:var(--fg-primary)}
.iconbtn svg{width:16px;height:16px}
.iconbtn-ghost{width:28px;height:28px}
.empty{padding:var(--sp-16) var(--sp-12);text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--sp-5);color:var(--fg-quaternary)}
.empty-icon{width:56px;height:56px;border-radius:50%;background:var(--bg-elevated);display:grid;place-items:center;border:1px dashed var(--border-base)}
.empty-icon svg{width:24px;height:24px;opacity:0.7}
.empty-title{font-size:var(--fs-md);color:var(--fg-secondary);font-weight:500}
.empty-text{font-size:var(--fs-xs);color:var(--fg-quaternary)}
.alert{display:flex;align-items:flex-start;gap:var(--sp-5);padding:var(--sp-6) var(--sp-8);border-radius:var(--r-md);font-size:var(--fs-sm);line-height:var(--lh-relaxed)}

/* ===== page shell ===== */
.app-root{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-base)}
.app-topbar{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-8) var(--sp-12);background:linear-gradient(180deg,var(--ink-850),var(--ink-900));border-bottom:1px solid var(--border-faint);flex-shrink:0}

.app-body{flex:1;display:flex;min-height:0}
</style>

<style>

<script>
// ===== Notifications =====
(function(){
const host = document.getElementById('toast-host');
function notify(opts) {
  const { title='提示', text='', kind='info', duration=5000, actions=[] } = opts;
  const t = document.createElement('div');
  t.className = 'toast toast-' + kind;
  t.style.setProperty('--toast-dur', duration + 'ms');
  const iconKey = {info:'info',success:'success',warn:'warn',error:'error'}[kind]||'info';
  t.innerHTML = `<div class="toast-icon">${icon(iconKey)}</div><div class="toast-body"><div class="toast-title"></div><div class="toast-text"></div></div><button class="toast-close">${icon('close')}</button><div class="toast-progress"><span></span></div>`;
  t.querySelector('.toast-title').textContent = title;
  t.querySelector('.toast-text').textContent = text;
  if (actions.length) {
    const row = document.createElement('div');
    row.className = 'toast-actions';
    actions.forEach(a => {
      const b = document.createElement('button');
      b.className = 'toast-action-btn';
      b.textContent = a.label;
      b.addEventListener('click', () => { try{a.onClick()}finally{remove()} });
      row.appendChild(b);
    });
    t.querySelector('.toast-body').appendChild(row);
  }
  host.appendChild(t);
  let timer = null;
  function remove() {
    if (!t.isConnected) return;
    t.classList.add('is-leaving');
    clearTimeout(timer);
    setTimeout(() => t.remove(), 220);
  }
  t.querySelector('.toast-close').addEventListener('click', remove);
  timer = setTimeout(remove, duration);
}
window.Notify = {
  info: (title, text, opts) => notify({...opts, title, text, kind:'info'}),
  success: (title, text, opts) => notify({...opts, title, text, kind:'success', duration: 4000}),
  warn: (title, text, opts) => notify({...opts, title, text, kind:'warn'}),
  error: (title, text, opts) => notify({...opts, title, text, kind:'error', duration: 8000}),
};
})();
</script>

<script>
// ===== Modal =====
(function(){
const host = document.getElementById('modal-host');
let openCount = 0;
window.Modal = {
  open({ size='md', title='', subtitle='', icon:iconName='', headerExtra='', body='', footer='', fullPane=false }) {
    const el = document.createElement('div');
    el.className = 'modal-frame';
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    el.appendChild(backdrop);
    const modal = document.createElement('div');
    modal.className = 'modal modal-' + size;
    modal.innerHTML = `<header class="modal-head">${iconName ? '<div class="modal-icon">'+icon(iconName)+'</div>' : ''}<div class="modal-title-block"><div class="modal-title">${title}</div>${subtitle ? '<div class="modal-subtitle">'+subtitle+'</div>' : ''}</div><div class="modal-actions">${headerExtra}</div><button class="modal-close">${icon('close')}</button></header><div class="modal-body ${fullPane?'':'modal-body-pad'}">${body}</div>${footer ? '<footer class="modal-foot">'+footer+'</footer>' : ''}`;
    el.appendChild(modal);
    host.appendChild(el);
    function close() {
      modal.classList.remove('is-open');
      backdrop.classList.remove('is-open');
      setTimeout(() => { el.remove(); openCount = Math.max(0, openCount - 1); if (openCount === 0) host.setAttribute('aria-hidden', 'true'); }, 220);
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); close(); } }
    backdrop.addEventListener('click', close);
    modal.querySelector('.modal-close').addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    requestAnimationFrame(() => { backdrop.classList.add('is-open'); modal.classList.add('is-open'); });
    openCount++;
    host.setAttribute('aria-hidden', 'false');
    return { el: modal, close, setBody(html) { modal.querySelector('.modal-body').innerHTML = html; }, setTitle(t, s) { modal.querySelector('.modal-title').innerHTML = t; const sub = modal.querySelector('.modal-subtitle'); if (sub) sub.textContent = s || ''; } };
  }
};
})();
</script>

let activeDocId = null;
let selectedNodeId = null;
let collapsedNodes = new Set();

function init() {
  docs = JSON.parse(JSON.stringify(sampleDocs));
  activeDocId = docs[0]?.id;
  selectedNodeId = null;
  bindAll();
  selectDoc(activeDocId);
}

function bindAll() {
  renderDocList();
  renderTree();
  renderProp();
  document.getElementById('rules-new-doc').addEventListener('click', () => {
    const id = 'doc-' + Date.now();
    docs.push({ id, name: '未命名文档', version: 'v0.1', desc: '', trigger: 'always', keywords: [], injection: 'after', format: 'indent', maxDepth: 3, sections: [] });
    activeDocId = id; selectedNodeId = null;
    renderDocList(); renderTree(); renderProp();
    Notify.success('已创建新文档', '请于右侧设置文档元数据。');
  });
  document.getElementById('rules-doc-list').addEventListener('click', e => {
    const it = e.target.closest('.rules-doc-item');
    if (it) selectDoc(it.getAttribute('data-id'));
  });
  document.getElementById('rules-tree-toolbar').addEventListener('click', e => {
    const b = e.target.closest('.toolbar-btn');
    if (!b) return;
    handleToolAction(b.getAttribute('data-act'));
  });
  document.getElementById('rules-preview-btn').addEventListener('click', openPreview);
}

function renderDocList() {
  const tagText = { always: '常驻', keyword: '关键词', book: '世界书', macro: '宏命令' };
  const html = docs.map(d => {
    const sectionCount = countNodes(d.sections);
    return `<div class="rules-doc-item ${d.id === activeDocId ? 'is-active' : ''}" data-id="${d.id}"><div class="rules-doc-item-name">${icon('document')}<span>${esc(d.name)}</span></div><div class="rules-doc-item-meta">${d.version} · ${sectionCount} 节</div><span class="rules-doc-item-tag ${d.trigger}">${tagText[d.trigger] || '未配置'}</span></div>`;
  }).join('');
  document.getElementById('rules-doc-list').innerHTML = html;
}

function countNodes(arr) { let n = 0; (arr || []).forEach(x => { n++; if (x.children) n += countNodes(x.children); }); return n; }
function selectDoc(id) { activeDocId = id; selectedNodeId = null; renderDocList(); renderTree(); renderProp(); }
function activeDoc() { return docs.find(d => d.id === activeDocId); }

function renderTree() {
  const doc = activeDoc();
  const body = document.getElementById('rules-tree-body');
  if (!doc) { body.innerHTML = ''; return; }
  numberize(doc.sections, []);
  const html = renderNodes(doc.sections, 0);
  body.innerHTML = html || `<div class="empty"><div class="empty-icon">${icon('feather')}</div><div class="empty-title">空白文档</div><div class="empty-text">点击工具栏「添加章节」开始创作</div></div>`;
  body.querySelectorAll('.tree-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.tree-actions')) return;
      if (e.target.closest('.tree-toggle')) {
        const id = row.getAttribute('data-id');
        if (collapsedNodes.has(id)) collapsedNodes.delete(id); else collapsedNodes.add(id);
        renderTree(); return;
      }
      selectedNodeId = row.getAttribute('data-id');
      renderTree(); renderProp();
    });
  });
  body.querySelectorAll('.tree-actions button').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const id = b.closest('.tree-row').getAttribute('data-id');
      const act = b.getAttribute('data-act');
      selectedNodeId = id;
      handleToolAction(act);
    });
  });
  if (selectedNodeId) {
    const r = body.querySelector('.tree-row[data-id="'+selectedNodeId+'"]');
    if (r) r.classList.add('is-selected');
  }
}

function numberize(arr, path) {
  (arr || []).forEach((n, i) => { const cur = [...path, i + 1]; n.__num = cur.join('.'); if (n.children) numberize(n.children, cur); });
}

function renderNodes(arr, depth) { return (arr || []).map(n => renderNode(n, depth)).join(''); }

function renderNode(n, depth) {
  const isSection = n.kind !== 'rule';
  const hasChildren = isSection && n.children && n.children.length > 0;
  const collapsed = collapsedNodes.has(n.id);
  const labelText = isSection ? (n.title || '（未命名章节）') : (n.text ? (n.text.length > 60 ? n.text.slice(0, 60) + '…' : n.text) : '（空规则）');
  return `<div class="tree-node" style="--indent:${depth};"><div class="tree-row kind-${isSection?'section':'rule'} ${selectedNodeId===n.id?'is-selected':''}" data-id="${n.id}"><span class="tree-handle">${icon('drag')}</span><button class="tree-toggle ${hasChildren?'':'is-empty'} ${collapsed?'is-collapsed':''}">${icon('chevronDown')}</button><span class="tree-num">${n.__num}</span><span class="tree-label"><span class="tree-label-icon">${icon(isSection?'folder':'feather')}</span><span class="tree-label-text">${esc(labelText)}</span>${n.locked ? '<span class="badge badge-amber" style="margin-left:auto;">'+icon('lock')+' 锁定</span>' : ''}</span><span class="tree-actions">${isSection ? '<button data-act="add-rule">'+icon('feather')+'</button>' : ''}<button data-act="add-section">'+icon('plus')+'</button><button data-act="duplicate">'+icon('copy')+'</button><button data-act="delete">'+icon('trash')+'</button></span></div>${isSection ? '<div class="tree-children '+ (collapsed?'is-collapsed':'') +'" style="--indent:'+depth+';">'+(hasChildren ? renderNodes(n.children, depth + 1) : '<div class="tree-empty-children" style="--indent:'+depth+';">空 · 可在此添加子节点</div>')+'</div>' : ''}</div>`;
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function findNode(arr, id, parent=null, index=-1) {
  for (let i = 0; i < (arr||[]).length; i++) {
    const n = arr[i];
    if (n.id === id) return { node:n, parent, list:arr, index:i };
    if (n.children) { const r = findNode(n.children, id, n, i); if (r) return r; }
  }
  return null;
}

function handleToolAction(act) {
  const doc = activeDoc();
  if (!doc) return;
  const found = selectedNodeId ? findNode(doc.sections, selectedNodeId) : null;
  switch (act) {
    case 'add-section': {
      const newNode = { id: 'n-'+Date.now()+'-'+Math.random().toString(36).slice(2,6), kind:'section', title:'新章节', children:[] };
      if (found && found.node.kind === 'section') { if (!found.node.children) found.node.children = []; found.node.children.push(newNode); }
      else if (found) { found.list.splice(found.index + 1, 0, newNode); }
      else { doc.sections.push(newNode); }
      selectedNodeId = newNode.id;
      break;
    }
    case 'add-rule': {
      const newNode = { id: 'n-'+Date.now()+'-'+Math.random().toString(36).slice(2,6), kind:'rule', text:'' };
      if (found && found.node.kind === 'section') { if (!found.node.children) found.node.children = []; found.node.children.push(newNode); }
      else if (found) { found.list.splice(found.index + 1, 0, newNode); }
      else { doc.sections.push(newNode); }
      selectedNodeId = newNode.id;
      break;
    }
    case 'duplicate': {
      if (!found) return Notify.warn('请先选中节点');
      const cp = JSON.parse(JSON.stringify(found.node));
      rekey(cp);
      found.list.splice(found.index + 1, 0, cp);
      selectedNodeId = cp.id;
      break;
    }
    case 'delete': {
      if (!found) return Notify.warn('请先选中节点');
      found.list.splice(found.index, 1);
      selectedNodeId = null;
      Notify.info('已删除节点', '编号已自动更新。');
      break;
    }
    case 'up': {
      if (!found || found.index === 0) return;
      const tmp = found.list[found.index - 1]; found.list[found.index - 1] = found.node; found.list[found.index] = tmp;
      break;
    }
    case 'down': {
      if (!found || found.index === found.list.length - 1) return;
      const tmp = found.list[found.index + 1]; found.list[found.index + 1] = found.node; found.list[found.index] = tmp;
      break;
    }
    case 'indent': {
      if (!found || found.index === 0) return;
      const prev = found.list[found.index - 1];
      if (prev.kind === 'section') { if (!prev.children) prev.children = []; prev.children.push(found.node); found.list.splice(found.index, 1); }
      break;
    }
    case 'outdent': {
      if (!found || !found.parent) return Notify.warn('已在最外层');
      const grand = findParent(doc.sections, found.parent.id);
      const list = grand ? grand.list : doc.sections;
      const parentIndex = list.indexOf(found.parent);
      list.splice(parentIndex + 1, 0, found.node);
      found.list.splice(found.index, 1);
      break;
    }
    case 'collapse-all': collapseAll(doc.sections, true); return;
    case 'expand-all': collapseAll(doc.sections, false); return;
  }
  renderTree(); renderProp(); renderDocList();
}

function rekey(n) { n.id = 'n-'+Date.now()+'-'+Math.random().toString(36).slice(2,6); if (n.children) n.children.forEach(rekey); }
function collapseAll(arr, on) {
  (arr||[]).forEach(n => { if (n.kind === 'section') { if (on) collapsedNodes.add(n.id); else collapsedNodes.delete(n.id); if (n.children) collapseAll(n.children, on); } });
  renderTree();
}
function findParent(arr, id) {
  for (let i = 0; i < arr.length; i++) {
    const n = arr[i]; if (n.id === id) return null;
    if (n.children) { const idx = n.children.findIndex(c => c.id === id); if (idx >= 0) return { parent:n, list:n.children, index:idx }; const r = findParent(n.children, id); if (r) return r; }
  }
  return null;
}

// Property panel
function renderProp() {
  const doc = activeDoc();
  const body = document.getElementById('rules-prop-body');
  const title = document.getElementById('rules-prop-title');
  if (!doc) { body.innerHTML = ''; return; }
  if (!selectedNodeId) {
    title.innerHTML = icon('sliders') + '<span>文档属性</span>';
    body.innerHTML = docPropHtml(doc);
    bindDocProp(doc);
  } else {
    const found = findNode(doc.sections, selectedNodeId);
    if (!found) { renderProp(); return; }
    title.innerHTML = icon(found.node.kind === 'rule' ? 'feather' : 'folder') + '<span>' + (found.node.kind === 'rule' ? '规则节点' : '章节节点') + ' · ' + found.node.__num + '</span>';
    body.innerHTML = nodePropHtml(found.node);
    bindNodeProp(found.node);
  }
}

function docPropHtml(doc) {
  const trig = doc.trigger || 'always';
  return `<div class="prop-card"><div class="prop-card-title">基础信息</div><div class="prop-row"><span class="prop-row-label">标题</span><input class="input" id="dp-name" value="${esc(doc.name)}"/></div><div class="prop-row"><span class="prop-row-label">版本</span><input class="input" id="dp-ver" value="${esc(doc.version||'v1.0')}"/></div><div class="prop-row"><span class="prop-row-label">描述</span><textarea class="textarea" id="dp-desc" rows="3">${esc(doc.desc||'')}</textarea></div></div><div class="prop-card"><div class="prop-card-title">触发方式</div><div class="trigger-segs" id="dp-trigger"><button data-v="always" class="${trig==='always'?'is-active':''}">${icon('flame')}<span>始终激活</span></button><button data-v="keyword" class="${trig==='keyword'?'is-active':''}">${icon('hash')}<span>关键词</span></button><button data-v="book" class="${trig==='book'?'is-active':''}">${icon('book')}<span>世界书联动</span></button><button data-v="macro" class="${trig==='macro'?'is-active':''}">${icon('zap')}<span>宏命令</span></button></div><div class="prop-row"><span class="prop-row-label">关键词（回车追加）</span><div class="kw-tag-input" id="dp-keywords">${(doc.keywords||[]).map(k => '<span class="kw-tag">'+esc(k)+'<span class="kw-tag-x" data-k="'+esc(k)+'">'+icon('close')+'</span></span>').join('')}<input id="dp-kw-input" placeholder="输入并按回车"/></div></div></div><div class="prop-card"><div class="prop-card-title">注入设置</div><div class="prop-row"><span class="prop-row-label">注入位置</span><select class="select" id="dp-injection"><option value="before" ${doc.injection==='before'?'selected':''}>角色描述之前</option><option value="after" ${doc.injection==='after'?'selected':''}>角色描述之后</option><option value="system" ${doc.injection==='system'?'selected':''}>系统提示（强制）</option></select></div><div class="prop-row"><span class="prop-row-label">渲染格式</span><select class="select" id="dp-format"><option value="indent" ${doc.format==='indent'?'selected':''}>缩进列表</option><option value="numeric" ${doc.format==='numeric'?'selected':''}>纯编号</option><option value="quote" ${doc.format==='quote'?'selected':''}>引用块</option></select></div><div class="prop-row"><span class="prop-row-label">最大注入深度：${doc.maxDepth||3}</span><input type="range" class="depth-slider" id="dp-depth" min="1" max="6" value="${doc.maxDepth||3}"/></div></div><div class="alert alert-info"><span class="alert-icon">${icon('info')}</span><div class="alert-body"><div class="alert-title">提示</div>当文档「常驻激活」时，每轮都会注入。仅有具体规则会被渲染。</div></div>`;
}

function bindDocProp(doc) {
  const root = document.getElementById('rules-prop-body');
  root.querySelector('#dp-name').addEventListener('input', e => { doc.name = e.target.value; renderDocList(); });
  root.querySelector('#dp-ver').addEventListener('input', e => { doc.version = e.target.value; renderDocList(); });
  root.querySelector('#dp-desc').addEventListener('input', e => { doc.desc = e.target.value; });
  root.querySelectorAll('#dp-trigger button').forEach(b => {
    b.addEventListener('click', () => {
      root.querySelectorAll('#dp-trigger button').forEach(x => x.classList.remove('is-active'));
      b.classList.add('is-active');
      doc.trigger = b.getAttribute('data-v');
      renderDocList();
    });
  });
  const kwInput = root.querySelector('#dp-kw-input');
  kwInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      const v = kwInput.value.trim().replace(/,/g, '');
      if (v && !(doc.keywords||[]).includes(v)) { doc.keywords = doc.keywords || []; doc.keywords.push(v); renderProp(); setTimeout(() => root.querySelector('#dp-kw-input')?.focus(), 0); }
      kwInput.value = '';
    }
  });
  root.querySelectorAll('.kw-tag-x').forEach(x => {
    x.addEventListener('click', () => { doc.keywords = (doc.keywords||[]).filter(z => z !== x.getAttribute('data-k')); renderProp(); });
  });
  root.querySelector('#dp-injection').addEventListener('change', e => doc.injection = e.target.value);
  root.querySelector('#dp-format').addEventListener('change', e => doc.format = e.target.value);
  root.querySelector('#dp-depth').addEventListener('input', e => { doc.maxDepth = +e.target.value; e.target.previousElementSibling.textContent = '最大注入深度：' + doc.maxDepth; });
}

function nodePropHtml(node) {
  if (node.kind === 'rule') {
    return `<div class="prop-card"><div class="prop-card-title">规则文本</div><textarea class="rule-text-editor" id="np-text" placeholder="写下一条规则……可使用 {{user}} / {{char}} 变量。">${esc(node.text||'')}</textarea><div class="prop-row"><span class="prop-row-label">变量插入</span><div class="var-insert"><button data-v="{{user}}">{{user}}</button><button data-v="{{char}}">{{char}}</button><button data-v="{{location}}">{{location}}</button><button data-v="{{date}}">{{date}}</button><button data-v="{{rand:1-20}}">{{rand:1-20}}</button></div></div></div><div class="prop-card"><div class="prop-card-title">编号</div><div class="prop-row row-inline"><span class="prop-row-label">自动编号</span><span style="font-family:var(--font-mono);color:var(--accent);">${node.__num}</span></div><div class="prop-row row-inline"><span class="prop-row-label">手动覆写</span><label class="switch"><input type="checkbox" id="np-locked" ${node.locked?'checked':''}><span class="switch-track"></span></label></div><div class="prop-row"><input class="input" id="np-num-override" placeholder="例如：1.2.附" value="${esc(node.numOverride||'')}" ${node.locked?'':'disabled'}/></div></div>`;
  }
  return `<div class="prop-card"><div class="prop-card-title">章节标题</div><input class="input" id="np-title" value="${esc(node.title||'')}" placeholder="例如：第三章 部活与社团"/></div><div class="prop-card"><div class="prop-card-title">编号</div><div class="prop-row row-inline"><span class="prop-row-label">自动编号</span><span style="font-family:var(--font-mono);color:var(--accent);">${node.__num}</span></div><div class="prop-row row-inline"><span class="prop-row-label">手动覆写</span><label class="switch"><input type="checkbox" id="np-locked" ${node.locked?'checked':''}><span class="switch-track"></span></label></div></div><div class="prop-card"><div class="prop-card-title">子节点</div><div style="display:flex;gap:var(--sp-3);"><button class="btn btn-ghost btn-sm" id="np-add-section">${icon('plus')}<span>添加子章节</span></button><button class="btn btn-ghost btn-sm" id="np-add-rule">${icon('feather')}<span>添加规则</span></button></div></div>`;
}

function bindNodeProp(node) {
  const root = document.getElementById('rules-prop-body');
  if (node.kind === 'rule') {
    root.querySelector('#np-text')?.addEventListener('input', e => { node.text = e.target.value; renderTree(); });
    root.querySelector('#np-locked')?.addEventListener('change', e => { node.locked = e.target.checked; renderTree(); renderProp(); });
    root.querySelector('#np-num-override')?.addEventListener('input', e => node.numOverride = e.target.value);
    root.querySelectorAll('.var-insert button').forEach(b => b.addEventListener('click', () => {
      const t = root.querySelector('#np-text');
      const v = b.getAttribute('data-v');
      const start = t.selectionStart, end = t.selectionEnd;
      t.value = t.value.slice(0, start) + v + t.value.slice(end);
      t.selectionStart = t.selectionEnd = start + v.length;
      node.text = t.value;
      t.focus();
      renderTree();
    }));
  } else {
    root.querySelector('#np-title')?.addEventListener('input', e => { node.title = e.target.value; renderTree(); });
    root.querySelector('#np-locked')?.addEventListener('change', e => { node.locked = e.target.checked; renderTree(); });
    root.querySelector('#np-add-section')?.addEventListener('click', () => handleToolAction('add-section'));
    root.querySelector('#np-add-rule')?.addEventListener('click', () => handleToolAction('add-rule'));
  }
}

// Preview
function openPreview() {
  const doc = activeDoc();
  if (!doc) return;
  const previewHtml = renderDocPreview(doc, doc.maxDepth || 3);
  Modal.open({
    size: 'lg', icon: 'eye',
    title: doc.name + ' · 预览',
    subtitle: 'Format: ' + doc.format + ' · Depth: ' + doc.maxDepth,
    body: `<div style="padding:var(--sp-10) var(--sp-12);width:100%;"><div class="alert alert-info" style="margin-bottom:var(--sp-8);"><span class="alert-icon">${icon('info')}</span><div class="alert-body"><div class="alert-title">下方为最终注入对话上下文的渲染示例。</div>触发方式：${({always:'常驻激活',keyword:'关键词触发',book:'世界书联动',macro:'宏命令'})[doc.trigger]}${doc.trigger==='keyword'?' · 关键词：'+(doc.keywords||[]).map(k=>'「'+k+'」').join('、'):''}</div></div><div class="rules-preview-modal-body">${previewHtml}</div></div>`,
  });
}

function renderDocPreview(doc, maxDepth) {
  if (doc.format === 'indent') return renderIndent(doc.sections, 1, maxDepth);
  else if (doc.format === 'numeric') return renderNumeric(doc.sections, maxDepth, []);
  else return renderQuote(doc.sections, 1, maxDepth);
}
function renderIndent(arr, depth, max) {
  if (depth > max) return '';
  return (arr||[]).map(n => { if (n.kind === 'rule') return '<li>'+esc(n.text||'')+'</li>'; const childHtml = renderIndent(n.children, depth + 1, max); return '<h3>'+n.__num+' '+esc(n.title||'')+'</h3>'+(childHtml ? '<ol>'+childHtml+'</ol>' : ''); }).join('');
}
function renderNumeric(arr, max, path) {
  return (arr||[]).map((n,i) => { const cur = [...path, i+1]; if (cur.length > max) return ''; if (n.kind === 'rule') return '<div>'+cur.join('.')+' '+esc(n.text||'')+'</div>'; return '<div><strong>'+cur.join('.')+' '+esc(n.title||'')+'</strong></div>'+renderNumeric(n.children, max, cur); }).join('');
}
function renderQuote(arr, depth, max) {
  if (depth > max) return '';
  return (arr||[]).map(n => { if (n.kind === 'rule') return '<blockquote style="margin:var(--sp-3) 0;padding:4px var(--sp-7);border-left:3px solid var(--wisteria-300);color:var(--fg-tertiary);">'+esc(n.text||'')+'</blockquote>'; return '<h3>'+n.__num+' '+esc(n.title||'')+'</h3>'+renderQuote(n.children, depth+1, max); }).join('');
}

// Export/Import
function exportDocs() {
  const blob = new Blob([JSON.stringify(docs, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'rules-docs.json'; a.click();
  Notify.success('已导出', docs.length + ' 个文档');
}
function importDocs() {
  const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error('格式错误');
        docs = data;
        activeDocId = docs[0]?.id;
        selectedNodeId = null;
        renderDocList(); renderTree(); renderProp();
        Notify.success('已导入', docs.length + ' 个文档');
      } catch(e) { Notify.error('导入失败', e.message); }
    };
    reader.readAsText(file);
  });
  input.click();
}

// Add export/import buttons
document.addEventListener('DOMContentLoaded', () => {
  init();
  const bar = document.querySelector('.app-topbar');
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:var(--sp-5);';
  div.innerHTML = `<button class="chip-btn" id="export-btn">${icon('download')}<span>导出</span></button><button class="chip-btn" id="import-btn">${icon('upload')}<span>导入</span></button>`;
  bar.appendChild(div);
  document.getElementById('export-btn').addEventListener('click', exportDocs);
  document.getElementById('import-btn').addEventListener('click', importDocs);
});
})();
</script>
</body>
